default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "trailing-whitespace", stages = ["pre-commit"] },
    { id = "end-of-file-fixer", stages = ["pre-commit"] },
    { id = "check-yaml", stages = ["pre-commit"] },
    { id = "check-toml", stages = ["pre-commit"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix --force-exclude"
language = "system"
types_or = ["python", "pyi"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format --force-exclude"
language = "system"
types_or = ["python", "pyi"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "basedpyright"
name = "basedpyright"
entry = "uv run basedpyright"
language = "system"
types_or = ["python", "pyi"]
pass_filenames = false
stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.5.0"
hooks = [
    { id = "conventional-pre-commit", stages = ["commit-msg"] },
]
